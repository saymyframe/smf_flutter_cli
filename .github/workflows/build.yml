name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Formatter output depends on the SDK version; keep in sync with the Dart
  # that ships with the Flutter stable used for development.
  DART_SDK: "3.12.2"

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # Setup Dart tools (Dart SDK, Melos, Mason)
      - name: Setup Dart tools
        uses: saymyframe/.github/.github/actions/setup-dart-tools@main
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ env.DART_SDK }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-${{ env.DART_SDK }}-pub-

      # Resolves the workspace and re-bundles every brick
      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Check brick bundles are up to date
        run: |
          if ! git diff --quiet -- '*_bundle.dart'; then
            git diff --stat -- '*_bundle.dart'
            echo "::error::Brick bundles are out of date. Run 'melos bootstrap' and commit the regenerated bundles."
            exit 1
          fi

      - name: Format
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Analyze brick hooks
        run: melos run analyze:hooks

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Test
        run: melos run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
