name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  # Every job, on any branch, such as that of a pull request into a branch
  # other than main that changes the jobs with Flutter.
  workflow_dispatch:

# A new run cancels the run that is still in progress: of a pull request,
# whose runs share a group by its number, and of a branch otherwise.
# cancel.yml joins the group of a pull request when the pull request is
# merged or closed, so that its run, whose checks nobody needs any more,
# stops.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Formatter output depends on the SDK version; keep in sync with the Dart
  # that ships with the Flutter stable used for development. The jobs with
  # Flutter below take it through the YAML anchor, and check that the
  # pinned Flutter comes with it.
  DART_SDK: &dart_sdk "3.12.2"

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # Setup Dart tools (Dart SDK, Melos, Mason)
      - name: Setup Dart tools
        id: dart
        uses: saymyframe/.github/.github/actions/setup-dart-tools@main
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ env.DART_SDK }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-${{ env.DART_SDK }}-pub-

      # Resolves the workspace and re-bundles every brick
      - name: Bootstrap workspace
        run: melos bootstrap

      # melos bootstrap bundles every brick; a new, changed or stale bundle
      # shows up as a change of the working tree.
      - name: Check generated files are up to date
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::melos bootstrap changed files, such as brick bundles. Run 'melos bootstrap' and commit what it generates."
            exit 1
          fi

      - name: Format
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Banned names
        run: melos run banlist

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Test
        id: test
        run: melos run test:coverage

      # The tests that failed, as annotations that the page of the run lists
      # at the top rather than as lines in the long log of the tests; see
      # tools/test_annotations.dart. Also after a failed step and in a
      # cancelled job, whenever Dart is there.
      - name: Annotate the failed tests
        if: ${{ always() && steps.dart.outcome == 'success' }}
        run: dart tools/test_annotations.dart

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Every line and branch of lib/ must be covered. After the scan, so
      # that SonarCloud gets the coverage when this check fails, and whether
      # the scan passes or not: a pull request from a fork has no token for
      # SonarCloud.
      - name: Coverage
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: melos run coverage:check

  # The jobs with Flutter, with the pinned one: many jobs, one for each app
  # or shard of the plan of apps.yml, those on macOS among them, for about
  # half an hour. So a pull request into a branch other than main, such as
  # one that collects the pull requests of a larger change, gets only the
  # checks above, and the pull request of that branch into main runs them.
  # Pushes to main and runs by hand run them too.
  apps:
    name: Pinned Flutter
    if: &every_job ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    uses: ./.github/workflows/apps.yml
    with:
      flutter_version: "3.44.2"
      dart_version: *dart_sdk
      # The SHA-256 of the release archive of the pinned Flutter for Linux,
      # for macOS on Apple silicon and for Windows, from releases_linux.json,
      # releases_macos.json and releases_windows.json in
      # https://storage.googleapis.com/flutter_infra_release/releases/
      linux_sha256: "b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e"
      macos_sha256: "57fbfdc7032678ab30ad577872bbfc4114a25d3cba94fbfa14a050ec61381a23"
      windows_sha256: "d79ae99807ba744b843e54f048308c629061456fdc7b0753251fb96eb5346a0e"
      compare_brick: true
      # Only these runs let flutterfire register the apps of CI in the
      # Firebase project, such as those of a new provider in the run of its
      # pull request into main; the nightly run finds them.
      register_firebase_apps: true
    secrets: inherit

  # The PowerShell script that installs the Firebase CLI, run for real: it
  # takes minutes, so it runs next to the job on Windows of apps.yml rather
  # than in it, and only when that job runs.
  windows-install:
    name: Firebase CLI install (Windows)
    if: *every_job
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        id: dart
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Get the packages of the workspace
        run: dart pub get

      # It changes the PATH of the user, which a machine of CI can take.
      - name: Install the Firebase CLI with the script of SMF
        working-directory: packages/smf_modules/smf_firebase_core
        env:
          SMF_INSTALL_FIREBASE_CLI: "1"
        run: dart test test/install_script_windows_test.dart --file-reporter json:build/test-results/install_script_windows_test.json

      # As in the job checks.
      - name: Annotate the failed tests
        if: ${{ always() && steps.dart.outcome == 'success' }}
        run: dart tools/test_annotations.dart

  # One check for the ruleset of main to require, whose name stays the same
  # when jobs come and go. It needs every other job of this workflow, which
  # tools/build_workflow_test.dart checks, and fails when one of them failed
  # or was cancelled. A skipped job counts as passed only in a pull request
  # into a branch other than main, which skips the jobs with Flutter: every
  # other run runs every job. It runs after a failed job too, but not in a
  # run that was cancelled, as when a newer commit of the branch replaces
  # it, so that the older commit gets no failed check.
  ci:
    name: CI
    needs:
      - checks
      - apps
      - windows-install
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Check the results of the jobs
        env:
          # Each job by its id, with its result: success, failure, cancelled
          # or skipped.
          NEEDS: ${{ toJSON(needs) }}
          # Whether this run runs every job. Written out rather than taken
          # from the anchor of the jobs with Flutter, so that a mistake in
          # their condition that skips them for main fails CI.
          EVERY_JOB: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::These jobs failed or were cancelled: ${failed//$'\n'/, }."
            exit 1
          fi
          skipped="$(jq -r 'to_entries[] | select(.value.result == "skipped") | .key' <<< "$NEEDS")"
          if [ "$EVERY_JOB" = true ] && [ -n "$skipped" ]; then
            echo "::error::These jobs were skipped, though pushes to main, pull requests into it and runs by hand run every job: ${skipped//$'\n'/, }."
            exit 1
          fi
