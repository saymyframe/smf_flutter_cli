name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Formatter output depends on the SDK version; keep in sync with the Dart
  # that ships with the Flutter stable used for development. The jobs with
  # Flutter below take it through the YAML anchor, and check that the
  # pinned Flutter comes with it.
  DART_SDK: &dart_sdk "3.12.2"

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # Setup Dart tools (Dart SDK, Melos, Mason)
      - name: Setup Dart tools
        uses: saymyframe/.github/.github/actions/setup-dart-tools@main
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ env.DART_SDK }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-${{ env.DART_SDK }}-pub-

      # Resolves the workspace and re-bundles every brick
      - name: Bootstrap workspace
        run: melos bootstrap

      # melos bootstrap bundles every brick; a new, changed or stale bundle
      # shows up as a change of the working tree.
      - name: Check generated files are up to date
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::melos bootstrap changed files, such as brick bundles. Run 'melos bootstrap' and commit what it generates."
            exit 1
          fi

      - name: Format
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Banned names
        run: melos run banlist

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Test
        run: melos run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The jobs with Flutter, with the pinned one.
  apps:
    name: Pinned Flutter
    uses: ./.github/workflows/apps.yml
    with:
      flutter_version: "3.44.2"
      dart_version: *dart_sdk
      # The SHA-256 of the release archive of the pinned Flutter for Linux,
      # for macOS on Apple silicon and for Windows, from releases_linux.json,
      # releases_macos.json and releases_windows.json in
      # https://storage.googleapis.com/flutter_infra_release/releases/
      linux_sha256: "b0de1d19754688ec6769c9a067db3b0594479d3d767f971bfecfc132904c8d5e"
      macos_sha256: "57fbfdc7032678ab30ad577872bbfc4114a25d3cba94fbfa14a050ec61381a23"
      windows_sha256: "d79ae99807ba744b843e54f048308c629061456fdc7b0753251fb96eb5346a0e"
      compare_brick: true
    secrets: inherit

  # The PowerShell script that installs the Firebase CLI, run for real: it
  # takes minutes, so it runs next to the job on Windows of apps.yml rather
  # than in it.
  windows-install:
    name: Firebase CLI install (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Get the packages of the workspace
        run: dart pub get

      # It changes the PATH of the user, which a machine of CI can take.
      - name: Install the Firebase CLI with the script of SMF
        working-directory: packages/smf_modules/smf_firebase_core
        env:
          SMF_INSTALL_FIREBASE_CLI: "1"
        run: dart test test/install_script_windows_test.dart
