name: Generated apps
# The jobs with Flutter, for one version of it: build.yml runs them with the
# pinned Flutter, and nightly.yml with every stable release that the
# generated apps allow.
on:
  workflow_call:
    inputs:
      flutter_version:
        description: The version of Flutter, such as 3.44.2.
        type: string
        required: true
      dart_version:
        description: The version of the Dart that comes with it, such as 3.12.2.
        type: string
        required: true
      linux_sha256:
        description: The SHA-256 of the release archive of the Flutter for Linux.
        type: string
        required: true
      macos_sha256:
        description: The SHA-256 of the release archive of the Flutter for macOS on Apple silicon, for the job on macOS.
        type: string
        default: ""
      windows_sha256:
        description: The SHA-256 of the release archive of the Flutter for Windows, for the job on Windows.
        type: string
        default: ""
      macos_and_windows:
        description: Whether the jobs on macOS and Windows run too, besides those on Linux.
        type: boolean
        default: true
      compare_brick:
        description: Whether to compare the brick of flutter_core with the app of flutter create, which follows the template of the pinned Flutter.
        type: boolean
        default: false
      pub_cache:
        description: Whether the jobs on Linux keep their pub packages in the cache of the repository.
        type: boolean
        default: true
      save_gradle_cache:
        description: Whether the job of the real modules on Linux saves what Gradle downloaded to the cache of the repository, once a week, rather than only restoring it.
        type: boolean
        default: true
      published_cli:
        description: Whether the job of the real modules on Linux also checks the apps of smf_flutter_cli from pub.dev, which users install.
        type: boolean
        default: false
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        description: The JSON key of a service account of the Firebase project of CI, with which the jobs configure an app with Firebase to start it. Without it, as in a pull request from a fork, they start only the app without Firebase.
        required: false

jobs:
  flutter:
    name: Generated apps (${{ matrix.registry }})
    runs-on: ubuntu-latest
    # About 10 minutes for the row of the modules of the CLI, and 7 more
    # for each app with every module, which it builds for Android and starts
    # on the Android emulator. The row of the fixtures takes about 11
    # minutes, and 1 more for each app with every module.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # real: the modules of the CLI; fixtures: the fake modules that use
        # the features of the module model that no real module uses yet.
        registry: [real, fixtures]
    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      FLUTTER_SHA256: ${{ inputs.linux_sha256 }}
      DART_SDK: ${{ inputs.dart_version }}
      PUB_ENVIRONMENT: ci
      # Whether the key of the service account is there; the key itself goes
      # only into the step that needs it.
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - uses: actions/checkout@v7

      # The repository allows only the actions of GitHub, of verified
      # creators and a few others by name, so Flutter comes from its release
      # archive rather than from a setup action.
      - name: Setup Flutter
        id: flutter
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "$FLUTTER_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          # The first run of flutter prints a notice about analytics, even
          # after the output of --machine.
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics

      # The Flutter the apps are checked with, and its Dart, which formats
      # them, must be those of the inputs.
      - name: Check the versions of Flutter and Dart
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter.json"
          cat "$RUNNER_TEMP/flutter.json"
          jq -e --arg flutter "$FLUTTER_VERSION" --arg dart "$DART_SDK" \
            '.frameworkVersion == $flutter and (.dartSdkVersion | startswith($dart))' \
            "$RUNNER_TEMP/flutter.json"

      # One cache per row: the apps of each row get their own packages.
      - name: Cache pub packages
        if: inputs.pub_cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-pub-${{ matrix.registry }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-pub-${{ matrix.registry }}-

      # Gradle downloads the Android Gradle Plugin, Kotlin and the Android
      # side of the plugins from Maven Central, which answers 403 to a
      # runner that downloads too much, as when the nightly run builds on
      # every version of Flutter at once. So the job of the real modules
      # keeps what Gradle downloaded, and Gradle itself, in one cache for
      # every version of Flutter, by the Android files of the bricks of the
      # modules and the week, so that a new version of a plugin gets
      # into it within a week. Each job restores the newest one; the runs of
      # pushes and pull requests save it, and of the nightly run only the
      # job with the latest Flutter, rather than each of its jobs. A cache
      # that nothing restores for 7 days is deleted by GitHub, so the caches
      # of past weeks go away.
      - name: Find the week of the cache of Gradle
        id: gradle_week
        if: matrix.registry == 'real'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle
        if: matrix.registry == 'real' && inputs.save_gradle_cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/smf_modules/*/bricks/*/__brick__/android/**') }}-${{ steps.gradle_week.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('packages/smf_modules/*/bricks/*/__brick__/android/**') }}-
            ${{ runner.os }}-gradle-

      - name: Restore the cache of Gradle
        if: matrix.registry == 'real' && !inputs.save_gradle_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/smf_modules/*/bricks/*/__brick__/android/**') }}-${{ steps.gradle_week.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('packages/smf_modules/*/bricks/*/__brick__/android/**') }}-
            ${{ runner.os }}-gradle-

      - name: Get the packages of the workspace
        run: dart pub get

      # Every app is generated with `smf create --no-input
      # --skip-external-setup --no-dart-fix --strict` and must pass
      # `flutter analyze`, and then the tests that the packages keep for it
      # in `app_tests/`, with `flutter test`. The matrices run in a directory
      # with a space in its name, and a later step checks the apps with
      # every module in a directory whose name has letters beyond ASCII too.
      - name: Generate, analyze and test the apps of the CLI's modules
        if: matrix.registry == 'real'
        run: dart run packages/smf_flutter_cli/tool/matrix.dart "$RUNNER_TEMP/SMF apps"

      # Android 15 (API level 35) with the Google APIs, which boots in the
      # background while the next steps build apps. The repository allows
      # no action for it, so it is set up here: KVM for the user of the
      # runner, the emulator and the image from the SDK manager of the
      # runner, and a virtual device without a window.
      # The directory of the AVD is set for avdmanager and the emulator
      # alike: avdmanager puts it under XDG_CONFIG_HOME, which the runners
      # set, while the emulator looks in ~/.android/avd.
      - name: Start an Android emulator
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        env:
          ANDROID_IMAGE: system-images;android-35;google_apis;x86_64
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$ANDROID_IMAGE" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name smf --package "$ANDROID_IMAGE" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" -avd smf -port 5554 -no-window \
            -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"

      # The steps below build and start the apps with every module that the
      # matrix tool generates with --create, one for each combination of the
      # providers of the roles that take one, such as one for each state
      # manager: each named after the providers other than the first of
      # their roles, such as android_app and android_app_riverpod. So a new
      # provider of the app entry, which owns the Android and Xcode
      # projects, or of any other such role gets its native build and start
      # without a change here. .github/scripts/each_app.sh runs a command
      # for each app of a directory, and fails when it fails for any.
      #
      # With the versions of Gradle, the Android Gradle Plugin and Kotlin
      # that the app entry sets, and the Android side of the plugins of the
      # modules.
      - name: Build the apps with every module for Android
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        run: |
          apps="$RUNNER_TEMP/SMF apps/android"
          dart run packages/smf_flutter_cli/tool/matrix.dart --create "$apps" android_app
          .github/scripts/each_app.sh "$apps" flutter build apk --debug

      # The apps with every module but the modules whose steps need an
      # external service, such as the Firebase project that flutterfire
      # configures an app in, and the modules that need those: so the apps
      # start as they are generated. The check that an app starts is an
      # entry of the app that the CLI keeps in app_tests/start, knowing no
      # module; the matrix tool adds it to the app as it adds it to the apps
      # of the matrix, where it is only analyzed.
      - name: Generate the apps without external services to start
        id: start_apps
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        run: |
          apps="$RUNNER_TEMP/SMF apps/start"
          dart run packages/smf_flutter_cli/tool/matrix.dart --create --without-external-steps "$apps" start_app
          for app in "$apps"/*/; do
            dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
              "${app%/}" packages/smf_flutter_cli/app_tests/start
          done
          # 10 minutes for each app: the 480 s that start_app.sh gives the
          # build and the start, and the log it prints after them.
          echo "minutes=$((10 * $(find "$apps" -mindepth 1 -maxdepth 1 -type d | wc -l)))" >> "$GITHUB_OUTPUT"

      - name: Wait for the Android emulator
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        timeout-minutes: 15
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          pid="$(cat "$RUNNER_TEMP/emulator.pid")"
          # Up to 10 minutes, but no longer than the emulator lives.
          for _ in $(seq 300); do
            if [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; then
              "$adb" devices
              exit 0
            fi
            if ! kill -0 "$pid" 2> /dev/null; then
              echo "::error::The Android emulator stopped before it started."
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::The Android emulator did not start in 10 minutes."
          cat "$RUNNER_TEMP/emulator.log"
          exit 1

      # .github/scripts/start_app.sh builds an app with the start check,
      # starts the app with adb and reads the result that the check writes,
      # in one try: unlike flutter test, it does not connect to the app. It
      # gives up on an app after the seconds it is given.
      - name: Start the apps without external services on the Android emulator
        if: ${{ !cancelled() && steps.start_apps.outcome == 'success' }}
        timeout-minutes: ${{ fromJSON(steps.start_apps.outputs.minutes || '10') }}
        run: |
          .github/scripts/each_app.sh "$RUNNER_TEMP/SMF apps/start" \
            "$GITHUB_WORKSPACE/.github/scripts/start_app.sh" android emulator-5554 480

      # An app with Firebase starts only once flutterfire configured it: the
      # placeholder of its options throws at start-up. flutterfire writes
      # the options of the Android and iOS apps with the ids of the app in
      # the Firebase project of CI, saymyframe-app-cli, and on Android adds
      # the Gradle plugins of Google services and Crashlytics. It registers
      # the Firebase apps when the project has none with those ids, and
      # finds them in later runs: the ids come from the organization of the
      # apps of CI, com.saymyframe.ci, and the name of the app,
      # firebase_start_app for the app with the first provider of each role
      # and firebase_start_app_<providers> for the others, such as
      # firebase_start_app_riverpod, which stay when another role gets a
      # second provider. The first run with an app registers it, the
      # Android one on Linux and the iOS one on macOS, one job each: the run
      # of the pull request that brings a new provider. Were they deleted,
      # jobs that run at the same time, such as those of the nightly, could
      # register one each, and the test of the configuration fails on a
      # project with several.
      - name: Generate the apps with every module to configure with Firebase
        id: firebase_apps
        if: ${{ !cancelled() && matrix.registry == 'real' && env.HAS_FIREBASE_KEY == 'true' }}
        run: |
          apps="$RUNNER_TEMP/SMF apps/firebase"
          dart run packages/smf_flutter_cli/tool/matrix.dart --create "$apps" firebase_start_app \
            --org com.saymyframe.ci
          for app in "$apps"/*/; do
            dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
              "${app%/}" packages/smf_flutter_cli/app_tests/start
          done
          # 10 minutes for each app: the 480 s that start_app.sh gives the
          # build and the start, and the log it prints after them.
          echo "minutes=$((10 * $(find "$apps" -mindepth 1 -maxdepth 1 -type d | wc -l)))" >> "$GITHUB_OUTPUT"

      - name: Install the Firebase CLI and the FlutterFire CLI
        if: ${{ !cancelled() && steps.firebase_apps.outcome == 'success' }}
        run: |
          npm install --global firebase-tools
          firebase --version
          dart pub global activate flutterfire_cli 1.4.1

      # A test of smf_firebase_core runs the command of the README of each
      # app for Android, with the key of the service account in a file that
      # only this step has.
      - name: Configure the apps with every module with Firebase for Android
        id: firebase_android
        if: ${{ !cancelled() && steps.firebase_apps.outcome == 'success' }}
        working-directory: packages/smf_modules/smf_firebase_core
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMF_FIREBASE_PROJECT: saymyframe-app-cli
          SMF_FIREBASE_SERVICE_ACCOUNT: ${{ runner.temp }}/firebase-service-account.json
          SMF_FIREBASE_PLATFORM: android
        run: |
          trap 'rm -f "$SMF_FIREBASE_SERVICE_ACCOUNT"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SMF_FIREBASE_SERVICE_ACCOUNT")
          unset FIREBASE_SERVICE_ACCOUNT
          "$GITHUB_WORKSPACE/.github/scripts/each_app.sh" --env SMF_FIREBASE_APP \
            "$RUNNER_TEMP/SMF apps/firebase" dart test test/flutterfire_configure_test.dart --file-reporter json:build/test-results/flutterfire_configure_test.json

      - name: Delete the key of the service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Start the apps with every module on the Android emulator
        if: ${{ !cancelled() && steps.firebase_android.outcome == 'success' }}
        timeout-minutes: ${{ fromJSON(steps.firebase_apps.outputs.minutes || '10') }}
        run: |
          .github/scripts/each_app.sh "$RUNNER_TEMP/SMF apps/firebase" \
            "$GITHUB_WORKSPACE/.github/scripts/start_app.sh" android emulator-5554 480

      - name: Leave out the apps with Firebase without the key
        if: ${{ !cancelled() && matrix.registry == 'real' && env.HAS_FIREBASE_KEY != 'true' }}
        run: echo "::notice::The secret FIREBASE_SERVICE_ACCOUNT is not there, as in a pull request from a fork, so the apps with Firebase do not start on the Android emulator."

      # The brick follows the template of the pinned Flutter, and another
      # one may differ from it without breaking the apps.
      - name: Compare the brick of flutter_core with flutter create
        if: ${{ !cancelled() && matrix.registry == 'real' && inputs.compare_brick }}
        run: |
          (cd "$RUNNER_TEMP" && flutter create --platforms=android,ios --org com.example --no-pub my_app)
          cd packages/smf_modules/smf_flutter_core
          SMF_FLUTTER_CREATE_APP="$RUNNER_TEMP/my_app" dart test test/flutter_create_test.dart --file-reporter json:build/test-results/flutter_create_test.json

      - name: Generate, analyze and test the apps of the fixture modules
        if: matrix.registry == 'fixtures'
        run: dart run packages/smf_pipeline/fixture_registry/tool/matrix.dart "$RUNNER_TEMP/SMF apps"

      # The apps with every module of the matrix, one for each combination
      # of the providers of the roles that take one, among them those with
      # the fixture module that generates code with build_runner. flutter
      # analyze of Flutter 3.44 and 3.47 fails in a directory whose path has
      # letters beyond ASCII, on every system
      # (https://github.com/flutter/flutter/pull/191377), so the matrix
      # analyzes the apps there with dart analyze.
      - name: Generate, analyze and test the apps with every module in a directory with letters beyond ASCII
        if: ${{ !cancelled() }}
        run: |
          apps="$RUNNER_TEMP/SMF apps застосунки é"
          if [ "$REGISTRY" = real ]; then
            dart run packages/smf_flutter_cli/tool/matrix.dart --every-module "$apps"
          else
            dart run packages/smf_pipeline/fixture_registry/tool/matrix.dart --every-module "$apps"
          fi
        env:
          REGISTRY: ${{ matrix.registry }}

      # What users install: smf_flutter_cli from pub.dev, with the versions
      # of its dependencies that pub resolves there rather than the packages
      # of the workspace. As a user does, outside the checkout, it generates
      # an app with every module for each state manager, with the full dart
      # fix, in a directory with a space in its name. A failure of these
      # steps affects the users of the published version, and its fix needs
      # a release of the packages.
      #
      # Unlike the steps above, these name the modules by hand: the CLI on
      # pub.dev has the modules of its release, which may differ from those
      # of the workspace, and it has no tool that lists them. The matrix of
      # the workspace checked every combination of their providers before
      # the release, so what these steps check besides is what only an
      # install from pub.dev has, the dependencies that pub resolves today
      # and the full dart fix, with a selection of modules as a user makes
      # it: every module, with each state manager, whose packages the other
      # modules do not bring. A release that changes the modules of the CLI
      # changes this selection too; one that adds a second provider of a
      # role that every app has, such as the app entry, fails here until it
      # names one. tools/workflow_apps_test.dart allows this step, and no
      # other, to name modules.
      - name: Activate the CLI from pub.dev
        id: pub_dev_cli
        if: ${{ !cancelled() && matrix.registry == 'real' && inputs.published_cli }}
        working-directory: ${{ runner.temp }}
        run: |
          dart pub global activate smf_flutter_cli
          bin="${PUB_CACHE:-$HOME/.pub-cache}/bin"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/smf" --version

      - name: Generate the apps with every module with the CLI from pub.dev
        id: pub_dev_apps
        if: ${{ !cancelled() && steps.pub_dev_cli.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: |
          for state in bloc riverpod; do
            smf create "${state}_app" \
              -m "go_router,home,bottom_tabs,$state,get_it,event_bus,firebase_crashlytics,firebase_analytics" \
              -o "$RUNNER_TEMP/SMF apps from pub.dev" --no-input --skip-external-setup --strict
          done

      - name: Analyze and test the apps of the CLI from pub.dev, and build them for Android
        if: ${{ !cancelled() && steps.pub_dev_apps.outcome == 'success' }}
        run: |
          for app in bloc_app riverpod_app; do
            cd "$RUNNER_TEMP/SMF apps from pub.dev/$app"
            flutter analyze
            flutter test
            flutter build apk --debug
          done

      # The tests of the packages that failed, as annotations that the page
      # of the run lists at the top rather than as lines in the long log of
      # a step; see tools/test_annotations.dart. Also after a failed step and
      # in a cancelled job, whenever Flutter is there.
      - name: Annotate the failed tests
        if: ${{ always() && steps.flutter.outcome == 'success' }}
        run: dart tools/test_annotations.dart

  macos:
    name: macOS
    if: inputs.macos_and_windows
    runs-on: macos-26
    # About 10 minutes, and 20 more for each app with every module, which
    # it builds for the iOS simulator, archives and starts on the simulator
    # with Firebase and without.
    timeout-minutes: 75
    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      FLUTTER_SHA256: ${{ inputs.macos_sha256 }}
      DART_SDK: ${{ inputs.dart_version }}
      PUB_ENVIRONMENT: ci
      # The Xcode of the image that builds the apps.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Whether the key of the service account is there; the key itself goes
      # only into the step that needs it.
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        id: flutter
        run: |
          archive="$RUNNER_TEMP/flutter.zip"
          curl -fsSL --retry 3 -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          echo "$FLUTTER_SHA256  $archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics

      - name: Check the versions of the tools
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter.json"
          cat "$RUNNER_TEMP/flutter.json"
          jq -e --arg flutter "$FLUTTER_VERSION" --arg dart "$DART_SDK" \
            '.frameworkVersion == $flutter and (.dartSdkVersion | startswith($dart))' \
            "$RUNNER_TEMP/flutter.json"
          xcodebuild -version
          which -a ruby
          ruby --version
          ruby -e "require 'xcodeproj'; puts \"xcodeproj #{Xcodeproj::VERSION}\""
          /usr/bin/ruby --version

      # Without a cache of pub packages: restoring it takes longer than
      # getting them.
      - name: Get the packages of the workspace
        run: dart pub get

      - name: Test the packages
        run: dart run melos exec -c 3 --dir-exists=test -- dart test --reporter expanded --file-reporter json:build/test-results/test.json

      - name: Test the tools
        if: ${{ !cancelled() }}
        run: dart test tools --file-reporter json:build/test-results/tools.json

      # The apps with every module that the matrix tool generates with
      # --create, one for each combination of the providers of the roles
      # that take one, such as one for each state manager, as ios_app and
      # ios_app_<providers>: so a new provider of the app entry, which owns
      # the Xcode project, or of any other such role gets its build, archive
      # and start without a change here, as on Linux. In a directory whose
      # name has a space and letters beyond ASCII.
      - name: Generate the apps with every module
        id: ios_apps
        if: ${{ !cancelled() }}
        run: |
          dart run packages/smf_flutter_cli/tool/matrix.dart --create \
            "$RUNNER_TEMP/SMF apps застосунки é/ios" ios_app

      - name: Build the apps with every module for the iOS simulator
        if: ${{ !cancelled() && steps.ios_apps.outcome == 'success' }}
        run: |
          .github/scripts/each_app.sh "$RUNNER_TEMP/SMF apps застосунки é/ios" \
            flutter build ios --simulator --no-codesign

      # With the build phase for Crashlytics that flutterfire configure adds,
      # fixed by the command that the README of the app gives.
      - name: Archive the apps with every module
        if: ${{ !cancelled() && steps.ios_apps.outcome == 'success' }}
        working-directory: packages/smf_modules/smf_firebase_core
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/each_app.sh" --env SMF_CRASHLYTICS_APP \
            "$RUNNER_TEMP/SMF apps застосунки é/ios" dart test test/crashlytics_archive_test.dart --file-reporter json:build/test-results/crashlytics_archive_test.json

      # The apps with every module but the modules whose steps need an
      # external service and those that need them, with the start check,
      # as on Linux. start_app.sh builds each for the iOS simulator.
      - name: Generate the apps without external services to start
        id: start_apps
        if: ${{ !cancelled() }}
        run: |
          apps="$RUNNER_TEMP/SMF apps застосунки é/start"
          dart run packages/smf_flutter_cli/tool/matrix.dart --create --without-external-steps "$apps" start_app
          for app in "$apps"/*/; do
            dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
              "${app%/}" packages/smf_flutter_cli/app_tests/start
          done
          # 13 minutes for each app: the 600 s that start_app.sh gives the
          # build and the start, and the log it prints after them.
          echo "minutes=$((13 * $(find "$apps" -mindepth 1 -maxdepth 1 -type d | wc -l)))" >> "$GITHUB_OUTPUT"

      # A new iPhone of the newest iOS runtime of the image that the SDK of
      # the Xcode of the job runs apps on; the image has several of each.
      - name: Boot an iOS simulator
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="$(xcrun simctl list runtimes available --json | jq -c --arg sdk "$sdk" '
            def version: split(".") | map(tonumber);
            [.runtimes[] | select(.platform == "iOS" and (.version | version) <= ($sdk | version))]
            | sort_by(.version | version) | last // empty')"
          if [ -z "$runtime" ]; then
            echo "::error::The image has no iOS runtime for the iOS $sdk SDK of Xcode."
            xcrun simctl list runtimes
            exit 1
          fi
          device_type="$(jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | first | .identifier' <<< "$runtime")"
          udid="$(xcrun simctl create 'SMF start' "$device_type" "$(jq -r .identifier <<< "$runtime")")"
          echo "iOS $(jq -r .version <<< "$runtime"), $device_type: $udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      # .github/scripts/start_app.sh builds an app with the start check,
      # starts the app with simctl and reads the result that the check
      # writes, in one try: unlike flutter test, it does not connect to the
      # app. It gives up on an app after the seconds it is given.
      - name: Start the apps without external services on the iOS simulator
        if: ${{ !cancelled() && env.SIMULATOR != '' && steps.start_apps.outcome == 'success' }}
        timeout-minutes: ${{ fromJSON(steps.start_apps.outputs.minutes || '13') }}
        run: |
          .github/scripts/each_app.sh "$RUNNER_TEMP/SMF apps застосунки é/start" \
            "$GITHUB_WORKSPACE/.github/scripts/start_app.sh" ios "$SIMULATOR" 600

      # Apps of their own rather than the apps with every module above,
      # whose Xcode projects have the build phase for Crashlytics of the
      # test of the archive: flutterfire configures them in the Firebase
      # project of CI, with the names and ids of the apps on Linux.
      - name: Generate the apps with every module to configure with Firebase
        id: firebase_apps
        if: ${{ !cancelled() && env.HAS_FIREBASE_KEY == 'true' }}
        run: |
          apps="$RUNNER_TEMP/SMF apps застосунки é/firebase"
          dart run packages/smf_flutter_cli/tool/matrix.dart --create "$apps" firebase_start_app \
            --org com.saymyframe.ci
          for app in "$apps"/*/; do
            dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
              "${app%/}" packages/smf_flutter_cli/app_tests/start
          done
          # 13 minutes for each app: the 600 s that start_app.sh gives the
          # build and the start, and the log it prints after them.
          echo "minutes=$((13 * $(find "$apps" -mindepth 1 -maxdepth 1 -type d | wc -l)))" >> "$GITHUB_OUTPUT"

      # The build phase for Crashlytics that flutterfire adds runs flutterfire
      # from ~/.pub-cache/bin in each build for iOS.
      - name: Install the Firebase CLI and the FlutterFire CLI
        if: ${{ !cancelled() && steps.firebase_apps.outcome == 'success' }}
        run: |
          npm install --global firebase-tools
          firebase --version
          dart pub global activate flutterfire_cli 1.4.1

      # A test of smf_firebase_core runs the command of the README of each
      # app for iOS, with the key of the service account in a file that only
      # this step has, and fixes the build phase for Crashlytics with the
      # command of the README, as SMF does after it configures an app.
      - name: Configure the apps with every module with Firebase for iOS
        id: firebase_ios
        if: ${{ !cancelled() && steps.firebase_apps.outcome == 'success' }}
        working-directory: packages/smf_modules/smf_firebase_core
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMF_FIREBASE_PROJECT: saymyframe-app-cli
          SMF_FIREBASE_SERVICE_ACCOUNT: ${{ runner.temp }}/firebase-service-account.json
          SMF_FIREBASE_PLATFORM: ios
        run: |
          trap 'rm -f "$SMF_FIREBASE_SERVICE_ACCOUNT"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SMF_FIREBASE_SERVICE_ACCOUNT")
          unset FIREBASE_SERVICE_ACCOUNT
          "$GITHUB_WORKSPACE/.github/scripts/each_app.sh" --env SMF_FIREBASE_APP \
            "$RUNNER_TEMP/SMF apps застосунки é/firebase" dart test test/flutterfire_configure_test.dart --file-reporter json:build/test-results/flutterfire_configure_test.json

      - name: Delete the key of the service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Start the apps with every module on the iOS simulator
        if: ${{ !cancelled() && env.SIMULATOR != '' && steps.firebase_ios.outcome == 'success' }}
        timeout-minutes: ${{ fromJSON(steps.firebase_apps.outputs.minutes || '13') }}
        run: |
          .github/scripts/each_app.sh "$RUNNER_TEMP/SMF apps застосунки é/firebase" \
            "$GITHUB_WORKSPACE/.github/scripts/start_app.sh" ios "$SIMULATOR" 600

      - name: Leave out the apps with Firebase without the key
        if: ${{ !cancelled() && env.HAS_FIREBASE_KEY != 'true' }}
        run: echo "::notice::The secret FIREBASE_SERVICE_ACCOUNT is not there, as in a pull request from a fork, so the apps with Firebase do not start on the iOS simulator."

      # As in the job on Linux.
      - name: Annotate the failed tests
        if: ${{ always() && steps.flutter.outcome == 'success' }}
        run: dart tools/test_annotations.dart

  windows:
    name: Windows
    if: inputs.macos_and_windows
    runs-on: windows-latest
    # About 5 minutes, and 4 more for each app with every module.
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      FLUTTER_SHA256: ${{ inputs.windows_sha256 }}
      DART_SDK: ${{ inputs.dart_version }}
      PUB_ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v7

      # SMF generates an app in %TEMP% and moves it into place, which the
      # job puts on another drive, as moving between drives copies the app.
      - name: Check that the temporary directories are on two drives
        run: |
          "TEMP: $env:TEMP"
          "RUNNER_TEMP: $env:RUNNER_TEMP"
          if ((Split-Path -Qualifier $env:TEMP) -eq (Split-Path -Qualifier $env:RUNNER_TEMP)) {
            throw 'TEMP and RUNNER_TEMP are on one drive.'
          }

      - name: Setup Flutter
        id: flutter
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          curl.exe -fsSL --retry 3 -o $archive "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:FLUTTER_SHA256) { throw "The SHA-256 of the archive is $hash." }
          # The tar of Windows, which reads a ZIP archive; that of Git does not.
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $archive
          Join-Path $env:RUNNER_TEMP 'flutter\bin' >> $env:GITHUB_PATH
          & (Join-Path $env:RUNNER_TEMP 'flutter\bin\flutter.bat') --disable-analytics

      - name: Check the versions of Flutter and Dart
        run: |
          $machine = flutter --version --machine | Out-String
          $machine
          $versions = $machine | ConvertFrom-Json
          if ($versions.frameworkVersion -ne $env:FLUTTER_VERSION -or -not $versions.dartSdkVersion.StartsWith($env:DART_SDK)) {
            throw "Flutter or Dart is not $env:FLUTTER_VERSION with Dart $env:DART_SDK."
          }

      # Without a cache of pub packages: restoring it takes longer than
      # getting them.
      - name: Get the packages of the workspace
        run: dart pub get

      - name: Test the packages
        run: dart run melos exec -c 4 --dir-exists=test -- dart test --reporter expanded --file-reporter json:build/test-results/test.json

      - name: Test the tools
        if: ${{ !cancelled() }}
        run: dart test tools --file-reporter json:build/test-results/tools.json

      # The apps with every module of the matrix, one for each combination
      # of the providers of the roles that take one, in a directory with a
      # space in its name, and then in one whose name has letters beyond
      # ASCII too, where the matrix analyzes the apps with dart analyze, as
      # flutter analyze of Flutter 3.44 and 3.47 fails there on every system
      # (https://github.com/flutter/flutter/pull/191377).
      - name: Generate, analyze and test the apps with every module
        if: ${{ !cancelled() }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dart run packages/smf_flutter_cli/tool/matrix.dart --every-module "$env:RUNNER_TEMP\SMF apps"
          dart run packages/smf_flutter_cli/tool/matrix.dart --every-module "$env:RUNNER_TEMP\SMF apps застосунки é"

      # As a user runs smf create, with the full dart fix of the app: the
      # matrix tool generates the apps with every module with the options
      # of CI, and --dart-fix after them turns the full dart fix back on.
      - name: Generate the apps with every module in a directory with letters beyond ASCII
        if: ${{ !cancelled() }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # smf writes UTF-8.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $apps = Join-Path $env:RUNNER_TEMP 'SMF apps застосунки é\user'
          $output = dart run packages/smf_flutter_cli/tool/matrix.dart --create $apps my_app --dart-fix | Out-String
          $output
          $generated = @(Get-ChildItem -Directory $apps)
          if ($generated.Count -eq 0) { throw "SMF generated no app in $apps." }
          foreach ($app in $generated) {
            if (-not $output.Contains("cd `"$($app.FullName)`"")) {
              throw "SMF does not say how to go to $($app.Name)."
            }
            Push-Location $app.FullName
            dart analyze --fatal-infos
            flutter test
            Pop-Location
          }
          # SMF generates the apps in %TEMP% and moves them to another drive.
          $left = Get-ChildItem $env:TEMP -Filter 'smf_create_*'
          if ($left) { throw "SMF left $left in $env:TEMP." }

      # What smf create --explain says of the machine for the apps with every
      # module, which have Firebase.
      - name: Run the FlutterFire CLI through dart.bat, and find it as SMF does
        if: ${{ !cancelled() }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dart pub global activate flutterfire_cli 1.4.1
          dart pub global run flutterfire_cli:flutterfire --version
          $explain = dart run packages/smf_flutter_cli/tool/matrix.dart --create "$env:RUNNER_TEMP\probe" probe --explain | Out-String
          $explain
          if ($explain -notmatch '(?m)FlutterFire CLI 1\.4\.1 or a later 1\.x \(for firebase_core\)\r?$') {
            throw 'SMF does not find the FlutterFire CLI.'
          }

      # As in the job on Linux.
      - name: Annotate the failed tests
        if: ${{ always() && steps.flutter.outcome == 'success' }}
        run: dart tools/test_annotations.dart
