name: Generated apps
# The jobs with Flutter, for one version of it: build.yml runs them with the
# pinned Flutter, and nightly.yml with every stable release that the
# generated apps allow.
on:
  workflow_call:
    inputs:
      flutter_version:
        description: The version of Flutter, such as 3.44.2.
        type: string
        required: true
      dart_version:
        description: The version of the Dart that comes with it, such as 3.12.2.
        type: string
        required: true
      linux_sha256:
        description: The SHA-256 of the release archive of the Flutter for Linux.
        type: string
        required: true
      macos_sha256:
        description: The SHA-256 of the release archive of the Flutter for macOS on Apple silicon, for the job on macOS.
        type: string
        default: ""
      windows_sha256:
        description: The SHA-256 of the release archive of the Flutter for Windows, for the job on Windows.
        type: string
        default: ""
      macos_and_windows:
        description: Whether the jobs on macOS and Windows run too, besides those on Linux.
        type: boolean
        default: true
      compare_brick:
        description: Whether to compare the brick of flutter_core with the app of flutter create, which follows the template of the pinned Flutter.
        type: boolean
        default: false
      pub_cache:
        description: Whether the jobs on Linux keep their pub packages in the cache of the repository.
        type: boolean
        default: true
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        description: The JSON key of a service account of the Firebase project of CI, with which the jobs configure an app with Firebase to start it. Without it, as in a pull request from a fork, they start only the app without Firebase.
        required: false

jobs:
  flutter:
    name: Generated apps (${{ matrix.registry }})
    runs-on: ubuntu-latest
    # About 25 minutes for the row of the modules of the CLI, with the
    # Android emulator.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # real: the modules of the CLI; fixtures: the fake modules that use
        # the features of the module model that no real module uses yet.
        registry: [real, fixtures]
    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      FLUTTER_SHA256: ${{ inputs.linux_sha256 }}
      DART_SDK: ${{ inputs.dart_version }}
      PUB_ENVIRONMENT: ci
      # Whether the key of the service account is there; the key itself goes
      # only into the step that needs it.
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - uses: actions/checkout@v7

      # The repository allows only the actions of GitHub, of verified
      # creators and a few others by name, so Flutter comes from its release
      # archive rather than from a setup action.
      - name: Setup Flutter
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "$FLUTTER_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          # The first run of flutter prints a notice about analytics, even
          # after the output of --machine.
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics

      # The Flutter the apps are checked with, and its Dart, which formats
      # them, must be those of the inputs.
      - name: Check the versions of Flutter and Dart
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter.json"
          cat "$RUNNER_TEMP/flutter.json"
          jq -e --arg flutter "$FLUTTER_VERSION" --arg dart "$DART_SDK" \
            '.frameworkVersion == $flutter and (.dartSdkVersion | startswith($dart))' \
            "$RUNNER_TEMP/flutter.json"

      # One cache per row: the apps of each row get their own packages.
      - name: Cache pub packages
        if: inputs.pub_cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-pub-${{ matrix.registry }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-pub-${{ matrix.registry }}-

      - name: Get the packages of the workspace
        run: dart pub get

      # Every app is generated with `smf create --no-input
      # --skip-external-setup --no-dart-fix --strict` and must pass
      # `flutter analyze`, and then the tests that the packages keep for it
      # in `app_tests/`, with `flutter test`. The matrices run in a directory
      # with a space in its name, and the last step checks one app in a
      # directory whose name has letters beyond ASCII too.
      - name: Generate, analyze and test the apps of the CLI's modules
        if: matrix.registry == 'real'
        run: dart run packages/smf_flutter_cli/tool/matrix.dart "$RUNNER_TEMP/SMF apps"

      # Android 15 (API level 35) with the Google APIs, which boots in the
      # background while the next step builds an app. The repository allows
      # no action for it, so it is set up here: KVM for the user of the
      # runner, the emulator and the image from the SDK manager of the
      # runner, and a virtual device without a window.
      - name: Start an Android emulator
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        env:
          ANDROID_IMAGE: system-images;android-35;google_apis;x86_64
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$ANDROID_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name smf --package "$ANDROID_IMAGE" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd smf -port 5554 -no-window \
            -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &

      # With the versions of Gradle, the Android Gradle Plugin and Kotlin
      # that the brick of flutter_core sets, and the Android side of the
      # plugins of Firebase.
      - name: Build an app with every module for Android
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        run: |
          dart run packages/smf_flutter_cli/bin/smf_flutter.dart create android_app \
            -m go_router,home,bottom_tabs,bloc,get_it,event_bus,firebase_crashlytics,firebase_analytics \
            -o "$RUNNER_TEMP/SMF apps" --no-input --skip-external-setup --no-dart-fix --strict
          cd "$RUNNER_TEMP/SMF apps/android_app"
          flutter build apk --debug

      - name: Wait for the Android emulator
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        timeout-minutes: 15
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          if ! timeout 600 "$adb" -s emulator-5554 wait-for-device shell \
            'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'; then
            echo "::error::The Android emulator did not start in 10 minutes."
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          "$adb" devices

      # The test that the app starts is a test of flutter_core in
      # app_tests/start, which the matrix tool adds to the app as it adds it
      # to the apps of the matrix, where it is only analyzed.
      - name: Start an app without Firebase on the Android emulator
        if: ${{ !cancelled() && matrix.registry == 'real' }}
        timeout-minutes: 20
        run: |
          dart run packages/smf_flutter_cli/bin/smf_flutter.dart create plain_app \
            -m go_router,home,bottom_tabs,riverpod,get_it,event_bus \
            -o "$RUNNER_TEMP/SMF apps" --no-input --skip-external-setup --no-dart-fix --strict
          dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
            "$RUNNER_TEMP/SMF apps/plain_app" packages/smf_modules/smf_flutter_core/app_tests/start
          cd "$RUNNER_TEMP/SMF apps/plain_app"
          flutter test integration_test -d emulator-5554

      # An app with Firebase starts only once flutterfire configured it: the
      # placeholder of its options throws at start-up. flutterfire writes
      # the options of the Android and iOS apps with the ids of the app in
      # the Firebase project of CI, saymyframe-app-cli, and on Android adds
      # the Gradle plugins of Google services and Crashlytics. It registers
      # the Firebase apps when the project has none with those ids, and
      # finds them in later runs: the ids come from the organization of the
      # apps of CI, com.saymyframe.ci, and the name of the app. The first
      # run registers them, the Android one on Linux and the iOS one on
      # macOS, one job each. Were they deleted, jobs that run at the same
      # time, such as those of the nightly, could register one each, and the
      # test of the configuration fails on a project with several.
      - name: Generate an app with every module to configure with Firebase
        if: ${{ !cancelled() && matrix.registry == 'real' && env.HAS_FIREBASE_KEY == 'true' }}
        run: |
          dart run packages/smf_flutter_cli/bin/smf_flutter.dart create firebase_start_app \
            -m go_router,home,bottom_tabs,bloc,get_it,event_bus,firebase_crashlytics,firebase_analytics \
            --org com.saymyframe.ci -o "$RUNNER_TEMP/SMF apps" --no-input --skip-external-setup \
            --no-dart-fix --strict
          dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
            "$RUNNER_TEMP/SMF apps/firebase_start_app" packages/smf_modules/smf_flutter_core/app_tests/start

      - name: Install the Firebase CLI and the FlutterFire CLI
        if: ${{ !cancelled() && matrix.registry == 'real' && env.HAS_FIREBASE_KEY == 'true' }}
        run: |
          npm install --global firebase-tools
          firebase --version
          dart pub global activate flutterfire_cli 1.4.1

      # A test of smf_firebase_core runs the command of the README of the app
      # for Android, with the key of the service account in a file that only
      # this step has.
      - name: Configure the app with every module with Firebase for Android
        id: firebase_android
        if: ${{ !cancelled() && matrix.registry == 'real' && env.HAS_FIREBASE_KEY == 'true' }}
        working-directory: packages/smf_modules/smf_firebase_core
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMF_FIREBASE_APP: ${{ runner.temp }}/SMF apps/firebase_start_app
          SMF_FIREBASE_PROJECT: saymyframe-app-cli
          SMF_FIREBASE_SERVICE_ACCOUNT: ${{ runner.temp }}/firebase-service-account.json
          SMF_FIREBASE_PLATFORM: android
        run: |
          trap 'rm -f "$SMF_FIREBASE_SERVICE_ACCOUNT"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SMF_FIREBASE_SERVICE_ACCOUNT")
          unset FIREBASE_SERVICE_ACCOUNT
          dart test test/flutterfire_configure_test.dart

      - name: Delete the key of the service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Start the app with every module on the Android emulator
        if: ${{ !cancelled() && steps.firebase_android.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/SMF apps/firebase_start_app
        run: flutter test integration_test -d emulator-5554

      - name: Leave out the app with Firebase without the key
        if: ${{ !cancelled() && matrix.registry == 'real' && env.HAS_FIREBASE_KEY != 'true' }}
        run: echo "::notice::The secret FIREBASE_SERVICE_ACCOUNT is not there, as in a pull request from a fork, so the app with Firebase does not start on the Android emulator."

      # The brick follows the template of the pinned Flutter, and another
      # one may differ from it without breaking the apps.
      - name: Compare the brick of flutter_core with flutter create
        if: ${{ !cancelled() && matrix.registry == 'real' && inputs.compare_brick }}
        run: |
          (cd "$RUNNER_TEMP" && flutter create --platforms=android,ios --org com.example --no-pub my_app)
          cd packages/smf_modules/smf_flutter_core
          SMF_FLUTTER_CREATE_APP="$RUNNER_TEMP/my_app" dart test test/flutter_create_test.dart

      - name: Generate, analyze and test the apps of the fixture modules
        if: matrix.registry == 'fixtures'
        run: dart run packages/smf_pipeline/fixture_registry/tool/matrix.dart "$RUNNER_TEMP/SMF apps"

      # flutter analyze of Flutter 3.44 and 3.47 fails in a directory whose
      # path has letters beyond ASCII, on every system
      # (https://github.com/flutter/flutter/pull/191377), so the matrix
      # analyzes the app there with dart analyze.
      - name: Generate, analyze and test an app in a directory with letters beyond ASCII
        if: ${{ !cancelled() }}
        run: |
          apps="$RUNNER_TEMP/SMF apps застосунки é"
          if [ "$REGISTRY" = real ]; then
            dart run packages/smf_flutter_cli/tool/matrix.dart "$apps" 'every module (riverpod)'
          else
            # With the fixture module that generates code with build_runner.
            dart run packages/smf_pipeline/fixture_registry/tool/matrix.dart "$apps" 'every module (go_router, get_it, fake_riverpod)'
          fi
        env:
          REGISTRY: ${{ matrix.registry }}

  macos:
    name: macOS
    if: inputs.macos_and_windows
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      FLUTTER_SHA256: ${{ inputs.macos_sha256 }}
      DART_SDK: ${{ inputs.dart_version }}
      PUB_ENVIRONMENT: ci
      # The Xcode of the image that builds the apps.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Whether the key of the service account is there; the key itself goes
      # only into the step that needs it.
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        run: |
          archive="$RUNNER_TEMP/flutter.zip"
          curl -fsSL --retry 3 -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          echo "$FLUTTER_SHA256  $archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics

      - name: Check the versions of the tools
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter.json"
          cat "$RUNNER_TEMP/flutter.json"
          jq -e --arg flutter "$FLUTTER_VERSION" --arg dart "$DART_SDK" \
            '.frameworkVersion == $flutter and (.dartSdkVersion | startswith($dart))' \
            "$RUNNER_TEMP/flutter.json"
          xcodebuild -version
          which -a ruby
          ruby --version
          ruby -e "require 'xcodeproj'; puts \"xcodeproj #{Xcodeproj::VERSION}\""
          /usr/bin/ruby --version

      # Without a cache of pub packages: restoring it takes longer than
      # getting them.
      - name: Get the packages of the workspace
        run: dart pub get

      - name: Test the packages
        run: dart run melos exec -c 3 --dir-exists=test -- dart test --reporter expanded

      - name: Test the tools
        if: ${{ !cancelled() }}
        run: dart test tools

      # In a directory whose name has a space and letters beyond ASCII.
      - name: Generate an app without Firebase and one with every module
        if: ${{ !cancelled() }}
        run: |
          smf() {
            dart run packages/smf_flutter_cli/bin/smf_flutter.dart create "$@" \
              -o "$RUNNER_TEMP/SMF apps застосунки é" --no-input \
              --skip-external-setup --no-dart-fix --strict
          }
          smf plain_app -m go_router,home,bottom_tabs,riverpod,get_it,event_bus
          smf firebase_app -m go_router,home,bottom_tabs,bloc,get_it,event_bus,firebase_crashlytics,firebase_analytics

      - name: Build the app without Firebase for the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/SMF apps застосунки é/plain_app
        run: flutter build ios --simulator --no-codesign

      - name: Build the app with every module for the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/SMF apps застосунки é/firebase_app
        run: flutter build ios --simulator --no-codesign

      # With the build phase for Crashlytics that flutterfire configure adds,
      # fixed by the command that the README of the app gives.
      - name: Archive the app with every module
        if: ${{ !cancelled() }}
        working-directory: packages/smf_modules/smf_firebase_core
        env:
          SMF_CRASHLYTICS_APP: ${{ runner.temp }}/SMF apps застосунки é/firebase_app
        run: dart test test/crashlytics_archive_test.dart

      # A new iPhone of the newest iOS runtime of the image that the SDK of
      # the Xcode of the job runs apps on; the image has several of each.
      - name: Boot an iOS simulator
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="$(xcrun simctl list runtimes available --json | jq -c --arg sdk "$sdk" '
            def version: split(".") | map(tonumber);
            [.runtimes[] | select(.platform == "iOS" and (.version | version) <= ($sdk | version))]
            | sort_by(.version | version) | last // empty')"
          if [ -z "$runtime" ]; then
            echo "::error::The image has no iOS runtime for the iOS $sdk SDK of Xcode."
            xcrun simctl list runtimes
            exit 1
          fi
          device_type="$(jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | first | .identifier' <<< "$runtime")"
          udid="$(xcrun simctl create 'SMF start' "$device_type" "$(jq -r .identifier <<< "$runtime")")"
          echo "iOS $(jq -r .version <<< "$runtime"), $device_type: $udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      # The test that the app starts is a test of flutter_core in
      # app_tests/start, which the matrix tool adds to the app as it adds it
      # to the apps of the matrix, where it is only analyzed.
      - name: Start the app without Firebase on the iOS simulator
        if: ${{ !cancelled() && env.SIMULATOR != '' }}
        timeout-minutes: 20
        run: |
          app="$RUNNER_TEMP/SMF apps застосунки é/plain_app"
          dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
            "$app" packages/smf_modules/smf_flutter_core/app_tests/start
          cd "$app"
          flutter test integration_test -d "$SIMULATOR"

      # An app of its own rather than firebase_app, whose Xcode project has
      # the build phase for Crashlytics of the test of the archive:
      # flutterfire configures it in the Firebase project of CI, as on
      # Linux.
      - name: Generate an app with every module to configure with Firebase
        if: ${{ !cancelled() && env.HAS_FIREBASE_KEY == 'true' }}
        run: |
          apps="$RUNNER_TEMP/SMF apps застосунки é"
          dart run packages/smf_flutter_cli/bin/smf_flutter.dart create firebase_start_app \
            -m go_router,home,bottom_tabs,bloc,get_it,event_bus,firebase_crashlytics,firebase_analytics \
            --org com.saymyframe.ci -o "$apps" --no-input --skip-external-setup --no-dart-fix --strict
          dart run packages/smf_flutter_cli/tool/matrix.dart --add-app-tests \
            "$apps/firebase_start_app" packages/smf_modules/smf_flutter_core/app_tests/start

      # The build phase for Crashlytics that flutterfire adds runs flutterfire
      # from ~/.pub-cache/bin in each build for iOS.
      - name: Install the Firebase CLI and the FlutterFire CLI
        if: ${{ !cancelled() && env.HAS_FIREBASE_KEY == 'true' }}
        run: |
          npm install --global firebase-tools
          firebase --version
          dart pub global activate flutterfire_cli 1.4.1

      # A test of smf_firebase_core runs the command of the README of the app
      # for iOS, with the key of the service account in a file that only
      # this step has, and fixes the build phase for Crashlytics with the
      # command of the README, as SMF does after it configures an app.
      - name: Configure the app with every module with Firebase for iOS
        id: firebase_ios
        if: ${{ !cancelled() && env.HAS_FIREBASE_KEY == 'true' }}
        working-directory: packages/smf_modules/smf_firebase_core
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMF_FIREBASE_APP: ${{ runner.temp }}/SMF apps застосунки é/firebase_start_app
          SMF_FIREBASE_PROJECT: saymyframe-app-cli
          SMF_FIREBASE_SERVICE_ACCOUNT: ${{ runner.temp }}/firebase-service-account.json
          SMF_FIREBASE_PLATFORM: ios
        run: |
          trap 'rm -f "$SMF_FIREBASE_SERVICE_ACCOUNT"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SMF_FIREBASE_SERVICE_ACCOUNT")
          unset FIREBASE_SERVICE_ACCOUNT
          dart test test/flutterfire_configure_test.dart

      - name: Delete the key of the service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Start the app with every module on the iOS simulator
        if: ${{ !cancelled() && env.SIMULATOR != '' && steps.firebase_ios.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/SMF apps застосунки é/firebase_start_app
        run: flutter test integration_test -d "$SIMULATOR"

      - name: Leave out the app with Firebase without the key
        if: ${{ !cancelled() && env.HAS_FIREBASE_KEY != 'true' }}
        run: echo "::notice::The secret FIREBASE_SERVICE_ACCOUNT is not there, as in a pull request from a fork, so the app with Firebase does not start on the iOS simulator."

  windows:
    name: Windows
    if: inputs.macos_and_windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      FLUTTER_SHA256: ${{ inputs.windows_sha256 }}
      DART_SDK: ${{ inputs.dart_version }}
      PUB_ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v7

      # SMF generates an app in %TEMP% and moves it into place, which the
      # job puts on another drive, as moving between drives copies the app.
      - name: Check that the temporary directories are on two drives
        run: |
          "TEMP: $env:TEMP"
          "RUNNER_TEMP: $env:RUNNER_TEMP"
          if ((Split-Path -Qualifier $env:TEMP) -eq (Split-Path -Qualifier $env:RUNNER_TEMP)) {
            throw 'TEMP and RUNNER_TEMP are on one drive.'
          }

      - name: Setup Flutter
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          curl.exe -fsSL --retry 3 -o $archive "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:FLUTTER_SHA256) { throw "The SHA-256 of the archive is $hash." }
          # The tar of Windows, which reads a ZIP archive; that of Git does not.
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $archive
          Join-Path $env:RUNNER_TEMP 'flutter\bin' >> $env:GITHUB_PATH
          & (Join-Path $env:RUNNER_TEMP 'flutter\bin\flutter.bat') --disable-analytics

      - name: Check the versions of Flutter and Dart
        run: |
          $machine = flutter --version --machine | Out-String
          $machine
          $versions = $machine | ConvertFrom-Json
          if ($versions.frameworkVersion -ne $env:FLUTTER_VERSION -or -not $versions.dartSdkVersion.StartsWith($env:DART_SDK)) {
            throw "Flutter or Dart is not $env:FLUTTER_VERSION with Dart $env:DART_SDK."
          }

      # Without a cache of pub packages: restoring it takes longer than
      # getting them.
      - name: Get the packages of the workspace
        run: dart pub get

      - name: Test the packages
        run: dart run melos exec -c 4 --dir-exists=test -- dart test --reporter expanded

      - name: Test the tools
        if: ${{ !cancelled() }}
        run: dart test tools

      # In a directory with a space in its name, and then in one whose name
      # has letters beyond ASCII too, where the matrix analyzes the app with
      # dart analyze, as flutter analyze of Flutter 3.44 and 3.47 fails there
      # on every system (https://github.com/flutter/flutter/pull/191377).
      - name: Generate, analyze and test the apps with every module
        if: ${{ !cancelled() }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dart run packages/smf_flutter_cli/tool/matrix.dart "$env:RUNNER_TEMP\SMF apps" 'every module (bloc)'
          dart run packages/smf_flutter_cli/tool/matrix.dart "$env:RUNNER_TEMP\SMF apps застосунки é" 'every module (riverpod)'

      # As a user runs it, with the full dart fix of the app.
      - name: Generate an app in a directory with letters beyond ASCII
        if: ${{ !cancelled() }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # smf writes UTF-8.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $apps = Join-Path $env:RUNNER_TEMP 'SMF apps застосунки é'
          $output = dart run packages/smf_flutter_cli/bin/smf_flutter.dart create my_app -m go_router,home,bottom_tabs,riverpod,get_it,event_bus,firebase_crashlytics,firebase_analytics -o $apps --no-input --skip-external-setup --strict | Out-String
          $output
          $app = Join-Path $apps 'my_app'
          if (-not $output.Contains("cd `"$app`"")) { throw 'SMF does not say how to go to the app.' }
          Set-Location $app
          dart analyze --fatal-infos
          flutter test
          # SMF generates the apps in %TEMP% and moves them to another drive.
          $left = Get-ChildItem $env:TEMP -Filter 'smf_create_*'
          if ($left) { throw "SMF left $left in $env:TEMP." }

      - name: Run the FlutterFire CLI through dart.bat, and find it as SMF does
        if: ${{ !cancelled() }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dart pub global activate flutterfire_cli 1.4.1
          dart pub global run flutterfire_cli:flutterfire --version
          $explain = dart run packages/smf_flutter_cli/bin/smf_flutter.dart create probe -m firebase_core --explain | Out-String
          $explain
          if ($explain -notmatch '(?m)FlutterFire CLI 1\.4\.1 or a later 1\.x \(for firebase_core\)\r?$') {
            throw 'SMF does not find the FlutterFire CLI.'
          }
