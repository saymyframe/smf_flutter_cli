name: auth_role
description: "The template of the auth role of SMF: the session of the app, and the service that a provider of sign-in implements."

# The template of a role in the module model. Its files are relative to the
# root of the generated app. The pipeline renders it with app_name, org_name,
# the has_<role> flags, the rendered sockets of its tags, and the variables
# the role's template returns from render().
version: 0.1.0+1

environment:
  mason: ^0.1.1
