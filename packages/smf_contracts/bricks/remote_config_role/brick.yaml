name: remote_config_role
description: "The template of the remote config role of SMF: the values of remote config of the app, with the defaults and the getters of its parameters, and the service that a provider of remote config implements."

# The template of a role in the module model. Its files are relative to the
# root of the generated app. The pipeline renders it with app_name, org_name,
# the has_<role> flags, the rendered sockets of its tags, and the variables
# the role's template returns from render().
version: 0.1.0+1

environment:
  mason: ^0.1.1
