name: notifications_role_step
description: "The template of the notifications role of SMF for an app with an onboarding screen: the functions of the step of the onboarding that asks for the permission to show notifications."

# A template of a role in the module model, which only the apps with the
# onboarding screen role get. Its files are relative to the root of the
# generated app. The pipeline renders it with app_name, org_name, the
# has_<role> flags, the rendered sockets of its tags, and the variables the
# role's template returns from render().
version: 0.1.0+1

environment:
  mason: ^0.1.1
