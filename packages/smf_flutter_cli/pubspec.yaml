name: smf_flutter_cli
description: "The smf command of Say My Frame: generates Flutter apps from independent modules, such as a router, tabs, dependency injection, state management and Firebase."
version: 0.4.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com
topics: [flutter, cli, code-generation, boilerplate, template]
screenshots:
  - description: "smf create in a terminal: the answers for an app with an onboarding, a start screen, settings, tabs, a theme, two languages, get_it and BLoC, and what follows."
    path: screenshots/smf_create.png
  - description: "The app that smf create generates, on a phone: the onboarding, the start screen, the settings screen, and the start screen in the dark theme and in Ukrainian."
    path: screenshots/app_look.png
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

executables:
  smf: smf_flutter

dependencies:
  ffi: ^2.1.0
  file: ^7.0.1
  mason_logger: ^0.3.3
  pub_semver: ^2.2.0

  # SMF packages
  smf_bloc: ^0.3.1
  smf_bottom_tabs: ^0.4.0
  smf_contracts: ^0.4.0
  smf_event_bus: ^0.3.1
  smf_firebase_analytics: ^0.4.0
  smf_firebase_core: ^0.4.0
  smf_firebase_crashlytics: ^0.4.0
  smf_flutter_core: ^0.4.0
  smf_gen_l10n: ^0.4.0
  smf_get_it: ^0.4.0
  smf_go_router: ^0.4.0
  smf_home_flutter: ^0.4.0
  smf_material_theme: ^0.4.0
  smf_onboarding: ^0.4.0
  smf_pipeline: ^0.4.0
  smf_riverpod: ^0.3.1
  smf_settings: ^0.4.0
  smf_shared_preferences: ^0.4.0

dev_dependencies:
  # The snapshots are formatted with it, so they change only when it does.
  dart_style: 3.1.13
  # The bricks of the roles that the tests define.
  mason: ^0.1.1
  path: ^1.9.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  xml: ^7.0.0
  yaml: ^3.1.2
