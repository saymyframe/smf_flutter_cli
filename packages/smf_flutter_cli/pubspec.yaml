name: smf_flutter_cli
description: "The smf command of Say My Frame: generates Flutter apps from independent modules, such as a router, tabs, dependency injection, state management and Firebase."
version: 0.3.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com
topics: [flutter, cli, code-generation, boilerplate, template]
screenshots:
  - description: "smf create in a terminal: the answers for a Flutter app with a start screen, tabs at the bottom, BLoC and get_it, and the steps that generate it."
    path: screenshots/smf_create.png
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

executables:
  smf: smf_flutter

dependencies:
  ffi: ^2.1.0
  file: ^7.0.1
  mason_logger: ^0.3.3
  pub_semver: ^2.2.0

  # SMF packages
  smf_bloc: ^0.3.0
  smf_bottom_tabs: ^0.3.0
  smf_contracts: ^0.3.0
  smf_event_bus: ^0.3.0
  smf_firebase_analytics: ^0.3.0
  smf_firebase_core: ^0.3.0
  smf_firebase_crashlytics: ^0.3.0
  smf_flutter_core: ^0.3.0
  smf_get_it: ^0.3.0
  smf_go_router: ^0.3.0
  smf_home_flutter: ^0.3.0
  smf_pipeline: ^0.3.0
  smf_riverpod: ^0.3.0
  smf_settings: ^0.3.0

dev_dependencies:
  # The snapshots are formatted with it, so they change only when it does.
  dart_style: 3.1.13
  # The bricks of the roles that the tests define.
  mason: ^0.1.1
  path: ^1.9.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  xml: ^7.0.0
  yaml: ^3.1.2
