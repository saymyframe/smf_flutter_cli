name: smf_flutter_cli
description: "CLI for SayMyFrame (SMF) Flutter: scaffold projects, configure modules, and generate code."
version: 0.2.1+1
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
topics: [flutter, cli, scaffolding, configuration, code-generation]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

executables:
  smf: smf_flutter

dependencies:
  ffi: ^2.1.0
  file: ^7.0.1
  mason_logger: ^0.3.3

  # SMF packages
  smf_bloc: ^0.2.0
  smf_contracts: ^0.2.0
  smf_flutter_core: ^0.2.1
  smf_pipeline: ^0.2.0
  smf_riverpod: ^0.2.0

dev_dependencies:
  # The snapshots are formatted with it, so they change only when it does.
  dart_style: 3.1.3
  path: ^1.9.1
  pub_semver: ^2.2.0
  test: ^1.24.0
  very_good_analysis: ^10.3.0
  xml: ^7.0.0
  yaml: ^3.1.2
