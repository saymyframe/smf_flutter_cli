name: smf_flutter_cli
description: "The smf command of Say My Frame: generates Flutter apps from independent modules, such as a router, tabs, sign-in, dependency injection, state management and Firebase."
version: 0.7.1
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com
topics: [flutter, cli, code-generation, boilerplate, template]
screenshots:
  - description: "smf create in a terminal: an app with an onboarding, sign-in with email, Google and Apple, a paywall, a start screen, tabs, two languages and notifications."
    path: screenshots/smf_create.png
  - description: "The app that smf create generates: the onboarding, the sign-in with Google, Apple and email, the start screen, and the paywall in dark and Ukrainian."
    path: screenshots/app_look.png
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

executables:
  smf: smf_flutter

dependencies:
  ffi: ^2.1.0
  file: ^7.0.1
  mason_logger: ^0.3.3
  pub_semver: ^2.2.0

  # SMF packages
  smf_apple_sign_in: ^0.6.1
  smf_bloc: ^0.3.4
  smf_bottom_tabs: ^0.4.3
  smf_contracts: ^0.7.0
  smf_dart_define: ^0.7.0
  smf_event_bus: ^0.3.4
  smf_firebase_analytics: ^0.4.3
  smf_firebase_auth: ^0.6.1
  smf_firebase_core: ^0.4.3
  smf_firebase_crashlytics: ^0.4.3
  smf_firebase_messaging: ^0.6.1
  smf_flutter_core: ^0.6.0
  smf_gen_l10n: ^0.5.1
  smf_get_it: ^0.4.3
  smf_go_router: ^0.6.1
  smf_google_sign_in: ^0.6.2
  smf_home_flutter: ^0.5.1
  smf_local_notifications: ^0.6.1
  smf_material_theme: ^0.4.3
  smf_native_splash: ^0.7.0
  smf_onboarding: ^0.6.0
  smf_paywall: ^0.7.0
  smf_pipeline: ^0.7.1
  smf_revenuecat: ^0.7.0
  smf_riverpod: ^0.3.4
  smf_settings: ^0.4.3
  smf_shared_preferences: ^0.4.4
  smf_sign_in: ^0.6.1

dev_dependencies:
  # The snapshots are formatted with it, so they change only when it does.
  dart_style: 3.1.13
  # The bricks of the roles that the tests define.
  mason: ^0.1.1
  path: ^1.9.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  xml: ^7.0.0
  yaml: ^3.1.2
