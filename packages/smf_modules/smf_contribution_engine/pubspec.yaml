name: smf_contribution_engine
description: Engine for structured code transformations in Dart/Flutter (insert/replace widgets, modify arguments, lists and classes).
version: 0.2.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_contribution_engine
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
topics: [codemod, refactoring, ast, analysis, codegen]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  analyzer: ">=7.5.9 <9.0.0"
  dart_style: ^3.1.0
  path: ^1.9.1
  mustachex: ^1.0.0
  mason_logger: ^0.3.3

dev_dependencies:
  very_good_analysis: ^10.3.0
  test: ^1.24.0
