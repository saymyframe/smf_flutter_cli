name: smf_settings
description: The SMF module of the settings screen of the Flutter app that SMF generates. The screen lists the settings that the modules of the app have, and an About row.
version: 0.3.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_settings
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/settings
topics: [flutter, template, feature, settings]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.3.0

dev_dependencies:
  analyzer: ^14.4.0
  # The layout whose main navigation shows the screen of the module.
  smf_bottom_tabs: ^0.3.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.3.0
  # The texts of the app, which the screen of the module reads its title from.
  smf_gen_l10n: ^0.3.0
  # The router that the tests render the route of the module with.
  smf_go_router: ^0.3.0
  smf_pipeline: ^0.3.0
  # The preferences that the localization role requires, in which an app
  # remembers its language.
  smf_shared_preferences: ^0.3.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
