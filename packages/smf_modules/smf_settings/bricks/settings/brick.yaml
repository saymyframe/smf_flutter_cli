name: settings
description: "The settings screen of an SMF app: an entry for each setting of its modules in one group, or a note for the developer of an app whose modules have none."

# A brick of the SMF module model. Its files are relative to the root of the
# generated app. The pipeline renders it with app_name, org_name, the
# has_<role> flags, the rendered sockets of its tags, and the variables of
# the module: text_title, the code that reads the title of the screen, which
# is a text of the app in an app with the localization role and the English
# text as a Dart string in an app without it, entries, the widgets of the
# entries with the imports of their files, and with_entries, whether the app
# has an entry: the screen has the group of the entries with one, and the
# note of an app without settings with none.
version: 0.1.0+1

environment:
  mason: ^0.1.1
