name: smf_get_it
description: The SMF module of dependency injection with get_it for the Flutter app that SMF generates. It registers the services that the modules of the app declare.
version: 0.2.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_get_it
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
topics: [flutter, dependency-injection, get-it, service-locator, scaffolding]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.2.0

dev_dependencies:
  analyzer: ^8.1.0
  # The container that the tests check the rendered code against.
  get_it: ^9.3.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.2.1
  smf_pipeline: ^0.2.0
  test: ^1.24.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
