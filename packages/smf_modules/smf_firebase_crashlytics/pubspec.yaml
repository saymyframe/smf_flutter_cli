name: smf_firebase_crashlytics
description: The SMF module of Firebase Crashlytics for the Flutter app that SMF generates. It reports the errors that the app does not handle to Firebase Crashlytics.
version: 0.3.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_firebase_crashlytics
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/firebase-crashlytics
topics: [flutter, firebase, crashlytics, crash-reporting]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.3.0
  # The module that sets up Firebase, which the module depends on.
  smf_firebase_core: ^0.3.0

dev_dependencies:
  analyzer: ^8.1.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.3.0
  # The DI container that registers the reporter in apps of the tests.
  smf_get_it: ^0.3.0
  smf_pipeline: ^0.3.0
  test: ^1.24.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
