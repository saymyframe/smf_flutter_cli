name: smf_local_notifications
description: The SMF module of notifications with flutter_local_notifications for the Flutter app that SMF generates. The app shows notifications now or at about a time to come, asks for the permission and hears of the taps.
version: 0.5.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_local_notifications
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/local-notifications
topics: [flutter, notifications, local-notifications, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.5.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.4.1
  # The provider of the localization role, which the notifications role
  # uses, in some apps of the tests.
  smf_gen_l10n: ^0.4.1
  # The router that the settings screen requires, in some apps of the tests.
  smf_go_router: ^0.5.0
  smf_pipeline: ^0.5.0
  # The provider of the settings screen role, which the notifications role
  # uses, in some apps of the tests.
  smf_settings: ^0.4.1
  # The provider of the preferences role, which the notifications role
  # requires.
  smf_shared_preferences: ^0.4.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  # The manifest of Android of the apps of the tests.
  xml: ^7.0.0
  yaml: ^3.1.2
