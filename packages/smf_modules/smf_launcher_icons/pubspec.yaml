name: smf_launcher_icons
description: The SMF module of the app icon with flutter_launcher_icons for the Flutter app that SMF generates, an opaque icon on iOS and an adaptive icon on Android.
version: 0.7.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_launcher_icons
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/launcher-icons
topics: [flutter, icons, launcher-icons, branding, cli]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.7.0

dev_dependencies:
  analyzer: ^14.4.0
  # Decodes the source images of the brick.
  image: ^4.8.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.6.0
  smf_pipeline: ^0.7.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
