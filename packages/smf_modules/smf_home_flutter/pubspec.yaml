name: smf_home_flutter
description: The SMF module of the start screen of the Flutter app that SMF generates. The screen shows the name of the app, and the app can open on it at /home.
version: 0.2.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_home_flutter
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
topics: [flutter, scaffolding, template, feature, home-screen]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.2.0

dev_dependencies:
  analyzer: ^8.1.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.2.1
  # The router that the tests render the route of the module with.
  smf_go_router: ^0.2.0
  smf_pipeline: ^0.2.0
  test: ^1.24.0
  very_good_analysis: ^10.3.0
