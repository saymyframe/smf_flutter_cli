name: smf_gen_l10n
description: The SMF module of localization with gen-l10n for the Flutter app that SMF generates. It keeps the texts of the app in ARB files, one for each language.
version: 0.3.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_gen_l10n
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/gen-l10n
topics: [flutter, localization, l10n, i18n, arb]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.3.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.3.0
  smf_pipeline: ^0.3.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
