name: smf_riverpod
description: The SMF module that manages the state of screens with Riverpod. It adds flutter_riverpod and its ProviderScope to the Flutter app that SMF generates.
version: 0.3.5
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_riverpod
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/riverpod
topics: [flutter, architecture, state-management, riverpod]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  smf_contracts: ^0.8.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.7.0
  # The languages of the app whose bridges the tests check.
  smf_gen_l10n: ^0.6.0
  # The theme of the app whose bridges the tests check.
  smf_material_theme: ^0.4.4
  smf_pipeline: ^0.8.0
  # The preferences that the theme and the languages of that app require.
  smf_shared_preferences: ^0.4.5
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
