name: smf_material_theme
description: The SMF module of the Material 3 theme for the Flutter app that SMF generates. It gives the app a light and a dark theme with a palette and a bundled font, in a file that you edit.
version: 0.4.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_material_theme
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/material-theme
topics: [flutter, theme, material-design, dark-mode, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.4.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.4.0
  # The localization that reads the texts of the entry of the theme mode in
  # the apps of the tests.
  smf_gen_l10n: ^0.4.0
  # The router that renders the route of the settings screen in the apps of
  # the tests.
  smf_go_router: ^0.4.0
  smf_pipeline: ^0.4.0
  # The settings screen that shows the entry of the theme mode in the apps of
  # the tests.
  smf_settings: ^0.4.0
  # The preferences in which the apps of the tests remember the theme mode.
  smf_shared_preferences: ^0.4.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
