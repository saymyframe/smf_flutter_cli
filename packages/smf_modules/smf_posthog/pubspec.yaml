name: smf_posthog
description: The SMF module of PostHog for the Flutter app that SMF generates. It records the events of the app and the screens that users see in PostHog.
version: 0.8.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_posthog
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/posthog
topics: [flutter, posthog, analytics, screen-tracking, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.8.0

dev_dependencies:
  analyzer: ^14.4.0
  # The requests to PostHog of the test with which CI checks that an event of
  # the app that it starts on a device reached the PostHog project of CI.
  http: ^1.6.0
  # The provider of the env role, which the module requires, in the apps of
  # the tests.
  smf_dart_define: ^0.7.1
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.7.0
  # The DI container that registers the service in apps of the tests.
  smf_get_it: ^0.4.4
  # The router that tells the listener about the screens in apps of the tests.
  smf_go_router: ^0.6.2
  smf_pipeline: ^0.8.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  # Parses the manifest of Android and Info.plist of the apps of the tests.
  xml: ^7.0.0
  yaml: ^3.1.2
