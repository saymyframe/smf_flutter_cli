name: smf_native_splash
description: The SMF module of the splash screen for the Flutter app that SMF generates. It makes the screen with flutter_native_splash, from two images in the app that you replace.
version: 0.7.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_native_splash
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/native-splash
topics: [flutter, splash-screen, branding, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.7.0

dev_dependencies:
  # Reads the pixels of the images in the brick.
  image: ^4.9.1
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.6.0
  smf_pipeline: ^0.7.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
