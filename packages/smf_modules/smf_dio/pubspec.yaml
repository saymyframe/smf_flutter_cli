name: smf_dio
description: The SMF module of the REST role with dio for the Flutter app that SMF generates. It sends the requests of the client of the role, with its guarantees, over Dio.
version: 0.7.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_dio
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/dio
topics: [flutter, http, rest, dio, networking]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.7.0

dev_dependencies:
  analyzer: ^14.4.0
  # The library that the tests check and run the rendered code against.
  dio: ^5.11.1
  # The provider of the env role, whose value the role reads.
  smf_dart_define: ^0.7.0
  # The provider of the auth role that the role uses, and what it depends on.
  smf_firebase_auth: ^0.6.1
  smf_firebase_core: ^0.4.3
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.6.0
  smf_pipeline: ^0.7.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
