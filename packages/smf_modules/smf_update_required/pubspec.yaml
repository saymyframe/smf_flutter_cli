name: smf_update_required
description: The SMF module of the screen "Update required" of the Flutter app that SMF generates. While the version of the app is below the lowest version in remote config, the screen takes the place of the app and leads to its store page.
version: 0.8.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_update_required
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/update-required
topics: [flutter, template, feature, update, remote-config]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.8.0

dev_dependencies:
  analyzer: ^14.4.0
  # The provider of the env role, which the review role requires.
  smf_dart_define: ^0.7.1
  # The module that sets up Firebase, which the provider of remote config of
  # the apps of the tests depends on.
  smf_firebase_core: ^0.5.0
  # The provider of the remote config role, which the module requires, in
  # the apps of the tests.
  smf_firebase_remote_config: ^0.8.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.7.0
  # The provider of the localization role, which the module uses, in some
  # apps of the tests.
  smf_gen_l10n: ^0.6.0
  # The router that renders the route of the module and asks its guard in
  # the apps of the tests.
  smf_go_router: ^0.6.2
  # The provider of the review role, which the module requires for the store
  # page, in the apps of the tests.
  smf_in_app_review: ^0.8.0
  smf_pipeline: ^0.8.0
  # The provider of the preferences role, which the review role requires.
  smf_shared_preferences: ^0.4.5
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
