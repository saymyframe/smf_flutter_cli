name: smf_bloc
description: The SMF module that manages the state of screens with BLoC. It adds flutter_bloc to the Flutter app that SMF generates.
version: 0.2.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_bloc
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
topics: [flutter, architecture, scaffolding, state-management, bloc]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  smf_contracts: ^0.2.0

dev_dependencies:
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.2.1
  smf_pipeline: ^0.2.0
  test: ^1.24.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
