name: smf_firebase_analytics
description: The SMF module of Firebase Analytics for the Flutter app that SMF generates. It records the events of the app and the screens that users see.
version: 0.3.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_firebase_analytics
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/firebase-analytics
topics: [flutter, firebase, analytics, firebase-analytics, screen-tracking]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.3.0
  # The module that sets up Firebase, which the module depends on.
  smf_firebase_core: ^0.3.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.3.0
  # The DI container that registers the service in apps of the tests.
  smf_get_it: ^0.3.0
  # The router that tells the listener about the screens in apps of the tests.
  smf_go_router: ^0.3.0
  smf_pipeline: ^0.3.0
  test: ^1.32.0
  very_good_analysis: ^11.0.0
  yaml: ^3.1.2
