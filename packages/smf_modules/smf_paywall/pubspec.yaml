name: smf_paywall
description: "The SMF module of the paywall of the Flutter app that SMF generates, with the screen of the subscription, its entry in the settings and its step in the onboarding."
version: 0.6.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_paywall
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/paywall
topics: [flutter, template, feature, paywall, subscriptions]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.6.0

dev_dependencies:
  analyzer: ^14.4.0
  # The package that flutter_bloc builds on, with which the tests run the
  # cubits of the screens without Flutter.
  bloc: ^9.0.0
  # The package that flutter_riverpod builds on, with which the tests run
  # the providers of the screens without Flutter.
  riverpod: ^3.4.3
  # A module that manages state, for the variant of the screens with it in
  # the apps that the tests render.
  smf_bloc: ^0.3.3
  # The provider of the env role, which the module requires, in the apps of
  # the tests.
  smf_dart_define: ^0.6.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.5.0
  # The provider of the localization role that gets the texts of the module
  # in some apps of the tests.
  smf_gen_l10n: ^0.5.0
  # The router that renders the routes of the module and asks its guard in
  # the apps of the tests.
  smf_go_router: ^0.6.0
  # The provider of the onboarding screen role, which gets the step of the
  # module in some apps of the tests.
  smf_onboarding: ^0.5.1
  smf_pipeline: ^0.6.0
  # The other module that manages state, for the variant with it.
  smf_riverpod: ^0.3.3
  # The provider of the settings screen role, which gets the entry of the
  # module in some apps of the tests.
  smf_settings: ^0.4.2
  # The provider of the preferences role, which the localization role
  # requires.
  smf_shared_preferences: ^0.4.3
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
