name: smf_firebase_remote_config
description: The SMF module of Firebase Remote Config for the Flutter app that SMF generates. The app reads values that the Firebase project changes without a new version of the app.
version: 0.8.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_firebase_remote_config
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/firebase-remote-config
topics: [flutter, firebase, remote-config, feature-flags, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.8.0
  # The module that sets up Firebase, which the module depends on.
  smf_firebase_core: ^0.5.0

dev_dependencies:
  analyzer: ^14.4.0
  # The access token of a service account, with which the tests that CI
  # runs publish a value in Remote Config of the Firebase project of CI and
  # remove it again.
  googleapis_auth: ^2.0.0
  # The requests of those tests to the REST API of Remote Config.
  http: ^1.6.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.7.0
  smf_pipeline: ^0.8.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
