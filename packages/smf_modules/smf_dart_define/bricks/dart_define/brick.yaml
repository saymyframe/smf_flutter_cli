name: dart_define
description: "The values of .env in an SMF app with --dart-define-from-file: AppEnv, and the run configurations of VS Code and Android Studio."

# A brick of the SMF module model. Its files are relative to the root of the
# generated app. The pipeline renders it with app_name, org_name, the
# has_<role> flags, the rendered sockets of its tags, and the variables
# that the render hook of the module returns.
version: 0.1.0+1

environment:
  mason: ^0.1.1
