name: smf_go_router
description: The SMF module that routes the Flutter app that SMF generates with go_router. It renders the routes that the modules of the app declare, the start route and the navigation facade.
version: 0.2.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_go_router
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
topics: [flutter, routing, go-router, navigation, scaffolding]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.2.0

dev_dependencies:
  analyzer: ^8.1.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.2.1
  smf_pipeline: ^0.2.0
  test: ^1.24.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
