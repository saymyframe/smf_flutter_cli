name: smf_go_router
description: The SMF module that routes the Flutter app that SMF generates with go_router. It renders the routes that the modules of the app declare and the router behind their navigation.
version: 0.3.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_go_router
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/go-router
topics: [flutter, routing, go-router, navigation]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.3.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.3.0
  smf_pipeline: ^0.3.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
