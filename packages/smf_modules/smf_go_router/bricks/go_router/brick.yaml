name: go_router
description: "The router of an SMF app with go_router: createAppRouter() with the routes of the modules of the app."

# A brick of the SMF module model. Its files are relative to the root of the
# generated app. The pipeline renders it with app_name, org_name, the
# has_<role> flags and the rendered sockets of its tags; the module adds
# initial_location, routes and value_checks.
version: 0.1.0+1

environment:
  mason: ^0.1.1
