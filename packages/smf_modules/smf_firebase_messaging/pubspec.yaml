name: smf_firebase_messaging
description: The SMF module of Firebase Cloud Messaging for the Flutter app that SMF generates. The app receives push messages and hears of the taps on them.
version: 0.6.1
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_firebase_messaging
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/firebase-messaging
topics: [flutter, firebase, push-notifications, firebase-messaging, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.7.0
  # The module that sets up Firebase, which the module depends on.
  smf_firebase_core: ^0.4.3

dev_dependencies:
  analyzer: ^14.4.0
  # The access token of a service account, with which the test that CI runs
  # sends a push message to the app that it starts on an Android emulator.
  googleapis_auth: ^2.0.0
  # The request of that test to Firebase Cloud Messaging.
  http: ^1.6.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.6.0
  # The provider of the notifications role, which the push role requires,
  # in the apps of the tests.
  smf_local_notifications: ^0.6.1
  smf_pipeline: ^0.7.1
  # The provider of the preferences role, which the notifications role
  # requires.
  smf_shared_preferences: ^0.4.4
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  # The manifest of Android of the apps of the tests.
  xml: ^7.0.0
  yaml: ^3.1.2
