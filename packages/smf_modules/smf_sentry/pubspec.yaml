name: smf_sentry
description: The SMF module of Sentry for the Flutter app that SMF generates. It reports the errors and the native crashes of the app to Sentry.
version: 0.8.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_sentry
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/sentry
topics: [flutter, sentry, crash-reporting, monitoring, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.8.0

dev_dependencies:
  analyzer: ^14.4.0
  # The requests to Sentry of the test with which CI checks that an event of
  # the app that it starts on a device reached the Sentry project of CI.
  http: ^1.6.0
  # The provider of the env role, which the module requires, in the apps of
  # the tests.
  smf_dart_define: ^0.7.1
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.7.0
  # The DI container that registers the reporter in some apps of the tests.
  smf_get_it: ^0.4.4
  smf_pipeline: ^0.8.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
