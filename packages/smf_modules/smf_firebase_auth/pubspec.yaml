name: smf_firebase_auth
description: The SMF module of Firebase Authentication for the Flutter app that SMF generates. Users sign in with an email address and a password, anonymously, or with Google and Apple.
version: 0.6.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_firebase_auth
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/firebase-auth
topics: [flutter, firebase, authentication, sign-in]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.6.0
  # The module that sets up Firebase, which the module depends on.
  smf_firebase_core: ^0.4.2

dev_dependencies:
  analyzer: ^14.4.0
  # The file system of the machine on which the tests run smf create.
  file: ^7.0.1
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.5.0
  # The provider of the localization role in the apps of the tests, whose
  # language the module gives the messages of Firebase.
  smf_gen_l10n: ^0.5.0
  # The provider of the router role, which the auth role uses, in the apps
  # of the tests.
  smf_go_router: ^0.6.0
  smf_pipeline: ^0.6.0
  # The provider of the preferences role, which the localization role
  # requires.
  smf_shared_preferences: ^0.4.3
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  # The parser of the Info.plist into which the script of the app writes the
  # URL scheme of Google.
  xml: ^7.0.0
  yaml: ^3.1.2
