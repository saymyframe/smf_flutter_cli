name: smf_onboarding
description: The SMF module of the onboarding of the Flutter app that SMF generates. A new user goes through it on the first launch, and the app remembers that it is finished.
version: 0.3.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_onboarding
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/onboarding
topics: [flutter, template, feature, onboarding]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.3.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.3.0
  # The provider of the localization role that gets the texts of the module
  # in the apps of the tests.
  smf_gen_l10n: ^0.3.0
  # The router that asks the guard of the module in the apps of the tests.
  smf_go_router: ^0.3.0
  smf_pipeline: ^0.3.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
