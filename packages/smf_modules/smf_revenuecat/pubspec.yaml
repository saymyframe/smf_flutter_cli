name: smf_revenuecat
description: The SMF module of RevenueCat for the Flutter app that SMF generates. The app sells its premium access with the plans of a RevenueCat offering, and restores it.
version: 0.6.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_revenuecat
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/revenuecat
topics: [flutter, revenuecat, in-app-purchase, subscriptions, template]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.6.0

dev_dependencies:
  analyzer: ^14.4.0
  # The provider of the env role, which the module requires, in the apps of
  # the tests.
  smf_dart_define: ^0.6.0
  # The provider of the auth role, which the purchases role uses, and the
  # module that sets up Firebase, which it depends on, in some apps of the
  # tests.
  smf_firebase_auth: ^0.6.0
  smf_firebase_core: ^0.4.2
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.5.0
  # The provider of the localization role, which the purchases role uses,
  # in some apps of the tests.
  smf_gen_l10n: ^0.5.0
  # The router that the settings screen requires, in some apps of the tests.
  smf_go_router: ^0.6.0
  smf_pipeline: ^0.6.0
  # The provider of the settings screen role, which the purchases role uses,
  # in some apps of the tests.
  smf_settings: ^0.4.2
  # The provider of the preferences role, which the localization role
  # requires.
  smf_shared_preferences: ^0.4.3
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
