name: smf_github_actions
description: The SMF module that gives the Flutter app that SMF generates its CI on GitHub Actions, the checks on each push and a build of the Android app on request.
version: 0.7.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_github_actions
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/github-actions
topics: [flutter, ci, github-actions, automation]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  smf_contracts: ^0.7.0

dev_dependencies:
  # The provider of the env role whose argument the tests see in the workflow.
  smf_dart_define: ^0.7.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.6.0
  smf_pipeline: ^0.7.1
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
