name: smf_bottom_tabs
description: The SMF module of the main navigation of the Flutter app that SMF generates. It shows a tab for each destination in a bar at the bottom, in the colours of the theme.
version: 0.4.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_bottom_tabs
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/bottom-tabs
topics: [flutter, navigation, layout, bottom-navigation]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.4.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.4.0
  # The texts of the app, which the labels of the destinations are read
  # from.
  smf_gen_l10n: ^0.4.0
  # The router that builds the main navigation of the apps of the tests.
  smf_go_router: ^0.4.0
  smf_pipeline: ^0.4.0
  # The preferences that the localization role requires, in which an app
  # remembers its language.
  smf_shared_preferences: ^0.4.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
