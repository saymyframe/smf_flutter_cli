name: smf_sign_in
description: "The SMF module of the sign-in screens of the Flutter app that SMF generates: sign-in, sign-up and password reset with an email address, with BLoC or with Riverpod."
version: 0.4.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_sign_in
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/sign-in
topics: [flutter, template, feature, sign-in]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.4.0

dev_dependencies:
  analyzer: ^14.4.0
  # The package that flutter_bloc builds on, with which the tests run the
  # cubits of the screens without Flutter.
  bloc: ^9.0.0
  # The package that flutter_riverpod builds on, with which the tests run
  # the providers of the screens without Flutter.
  riverpod: ^3.4.3
  # A module that manages state, for the variant of the screens with it in
  # the apps that the tests render.
  smf_bloc: ^0.3.1
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.4.0
  # The provider of the localization role that gets the texts of the module
  # in the apps of the tests.
  smf_gen_l10n: ^0.4.0
  # The router that renders the routes of the module and asks its guards in
  # the apps of the tests.
  smf_go_router: ^0.4.0
  smf_pipeline: ^0.4.0
  # The other module that manages state, for the variant with it.
  smf_riverpod: ^0.3.1
  # The provider of the preferences role, which the localization role
  # requires.
  smf_shared_preferences: ^0.4.0
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
