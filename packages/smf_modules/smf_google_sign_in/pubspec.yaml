name: smf_google_sign_in
description: The SMF module of Google sign-in for the Flutter app that SMF generates. The users of the app sign in with their Google account on Android and iOS.
version: 0.6.1
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli/tree/main/packages/smf_modules/smf_google_sign_in
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
documentation: https://doc.saymyframe.com/modules/google-sign-in
topics: [flutter, google, authentication, sign-in]
license: Apache-2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  mason: ^0.1.1
  smf_contracts: ^0.7.0

dev_dependencies:
  analyzer: ^14.4.0
  # The app entry of the apps that the tests render.
  smf_flutter_core: ^0.6.0
  # The provider of the localization role that gets the label of the button
  # in some of the apps of the tests.
  smf_gen_l10n: ^0.5.1
  smf_pipeline: ^0.7.0
  # The provider of the preferences role, which the localization role
  # requires.
  smf_shared_preferences: ^0.4.4
  test: ^1.32.0
  very_good_analysis: ^10.3.0
  yaml: ^3.1.2
