name: smf_flutter_cli_monorepo
description: A monorepo containing SMF Flutter CLI tools and modules for scaffolding Flutter applications
version: 0.2.0
homepage: https://saymyframe.com
repository: https://github.com/saymyframe/smf_flutter_cli
issue_tracker: https://github.com/saymyframe/smf_flutter_cli/issues
license: Apache-2.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - packages/smf_flutter_cli
  - packages/smf_contracts
  - packages/smf_modules/smf_contribution_engine
  - packages/smf_modules/smf_event_bus
  - packages/smf_modules/smf_firebase_analytics
  - packages/smf_modules/smf_firebase_core
  - packages/smf_modules/smf_firebase_crashlytics
  - packages/smf_modules/smf_flutter_core
  - packages/smf_modules/smf_get_it
  - packages/smf_modules/smf_go_router
  - packages/smf_modules/smf_home_flutter

executables:
  smfflutter: smfflutter_dev

dev_dependencies:
  lints: ^6.0.0
  melos: ^7.1.0

melos:
  ignore:
    - "**/__brick__/**"
    - "**/brick/**"
    - "**/bricks/**"

  scripts:
    bundle:
      run: |
        melos exec -c 6 --fail-fast --dir-exists="bricks" -- \
          dart $MELOS_ROOT_PATH/tools/bundle_bricks.dart

    # Quality gates. Formatting covers hand-written package code only
    # (lib, test, bin): bricks/**/__brick__ holds mustache templates, and
    # lib/bundles is generated (CI checks it matches the bricks instead).
    analyze:
      run: melos exec -c 6 -- dart analyze --fatal-infos --fatal-warnings
    analyze:hooks:
      description: Analyze brick hooks, which are packages with their own pubspec.
      run: |
        for hooks in $(find packages -path '*/bricks/*/hooks/pubspec.yaml' -exec dirname {} \;); do
          echo "Analyzing $hooks"
          (cd "$hooks" && dart pub get > /dev/null && dart analyze --fatal-infos --fatal-warnings) || exit 1
        done
    format:
      run: melos exec -c 6 -- 'dart format $(find $(ls -d lib test bin 2>/dev/null) -name "*.dart" -not -path "lib/bundles/*")'
    format:check:
      run: melos exec -c 6 -- 'dart format --output=none --set-exit-if-changed $(find $(ls -d lib test bin 2>/dev/null) -name "*.dart" -not -path "lib/bundles/*")'
    test:
      run: melos exec -c 4 --fail-fast --dir-exists=test -- dart test --reporter expanded
    test:coverage:
      description: Run tests and write coverage/lcov.info in every package with tests.
      run: melos exec -c 1 --fail-fast --dir-exists=test -- dart pub global run coverage:test_with_coverage
    check:
      run: |
        melos run format:check && \
        melos run analyze && \
        melos run analyze:hooks && \
        melos run test

  command:
    bootstrap:
      # https://github.com/dart-lang/pub/issues/3404
      runPubGetInParallel: false
      hooks:
        # Automatically bundle after bootstrap so dev env is ready
        post:
          run: melos run bundle

    version:
      # Generate commit links in package changelogs.
      linkToCommits: true
      # Additionally build a changelog at the root of the workspace.
      workspaceChangelog: true
      # Also update version constraints in dependent packages automatically.
      updateDependents: true
      hooks:
        # Keep `smf --version` in sync with the bumped CLI version.
        preCommit: |
          dart tools/sync_cli_version.dart && \
          git add packages/smf_flutter_cli/lib/version.dart
